<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuhsantara Secure Token Generator</title>
  
  <!-- FAVICON / LOGO TAB BROWSER -->
  <link rel="icon" type="image/png" href="../app-proses-data/icon-v2-192.png">
  <link rel="apple-touch-icon" href="../app-proses-data/icon-v2-192.png">

  <style>
    body { background: #070b14; color: #f8fafc; font-family: monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { position: relative; background: #0f172a; border: 1px solid #334155; padding: 30px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    h2 { color: #38bdf8; font-size: 18px; margin: 0; text-align: left; }
    .btn-close-dash {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #475569;
      color: #cbd5e1;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: monospace;
    }
    .btn-close-dash:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #f87171;
    }
    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
    
    input, select { 
      width: 100%; padding: 10px; background: #020617; border: 1px solid #475569; 
      color: white; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; 
      font-family: monospace; font-size: 13px; outline: none;
    }
    input:focus, select:focus { border-color: #38bdf8; }

    /* Custom Input Tanggal & Dropdown */
    .date-select-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .date-select-group select { margin-bottom: 0; }

    /* Tombol Pilihan Cepat (Presets) */
    .preset-btns { display: flex; gap: 6px; margin-bottom: 16px; }
    .btn-preset { background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 6px 10px; font-size: 11px; border-radius: 6px; cursor: pointer; flex: 1; font-family: monospace; }
    .btn-preset:hover { background: #0284c7; color: white; border-color: #38bdf8; }

    button.btn-generate { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 13px; }
    button.btn-generate:hover { background: #0369a1; }
    
    .result-wrapper { position: relative; margin-top: 20px; }
    .result { background: #020617; padding: 12px 42px 12px 12px; border: 1px dashed #38bdf8; border-radius: 8px; word-break: break-all; color: #38bdf8; font-size: 11.5px; text-align: left; min-height: 42px; box-sizing: border-box; display: flex; align-items: center; }
    
    .btn-copy { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: #1e293b; border: 1px solid #475569; color: #38bdf8; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .btn-copy:hover { background: #334155; border-color: #38bdf8; }

    /* Penyesuaian Ikon Kalender Native Browser */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h2>🔐 Secure Token Generator</h2>
      <button type="button" class="btn-close-dash" title="Tutup & Kembali ke Dashboard" onclick="kembaliKeDashboard()">&times;</button>
    </div>

    <!-- PILIHAN DURASI CEPAT -->
    <label>Pilih Durasi Cepat:</label>
    <div class="preset-btns">
      <button type="button" class="btn-preset" onclick="setDurationPreset(1)">+1 Bulan</button>
      <button type="button" class="btn-preset" onclick="setDurationPreset(3)">+3 Bulan</button>
      <button type="button" class="btn-preset" onclick="setDurationPreset(6)">+6 Bulan</button>
      <button type="button" class="btn-preset" onclick="setDurationPreset(12)">+1 Tahun</button>
    </div>

    <!-- PENGATURAN TANGGAL KUSTOM -->
    <label>Atau Pilih Tanggal manual (dd/mm/yyyy):</label>
    <input type="date" id="inputTanggal">

    <!-- DROPDOWN ALTERNATIF BULAN & TAHUN -->
    <div class="date-select-group">
      <select id="selectTgl" style="flex: 1;"></select>
      <select id="selectBulan" style="flex: 2;"></select>
      <select id="selectTahun" style="flex: 1.5;"></select>
    </div>
    
    <button type="button" class="btn-generate" onclick="generateSecureToken()">GENERATE SECURE TOKEN</button>

    <div class="result-wrapper">
      <div class="result" id="outputToken">Token aman akan muncul di sini...</div>
      <button type="button" class="btn-copy" id="btnCopyToken" title="Salin Token" onclick="copyTokenText()">
        <svg id="copyIconSvg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    // Hindari huruf 'N' dan 'X' agar tidak memicu split("NX") palsu pada decoder
    const SAFE_RANDOM_CHARS = "ABCDEFGHJKLMNPQRSTUVWYZabcdefghijkmnpqrstuvwxyz0123456789";

    function kembaliKeDashboard() {
      window.location.href = "../index.html";
    }

    function populateDaysForMonthYear(year, monthIndex, preferredDay = 1) {
      const selTgl = document.getElementById('selectTgl');
      const maxDays = new Date(year, monthIndex + 1, 0).getDate();
      const clampedDay = Math.min(Math.max(1, parseInt(preferredDay, 10) || 1), maxDays);

      selTgl.innerHTML = '';
      for (let i = 1; i <= maxDays; i++) {
        const opt = document.createElement('option');
        const val = i < 10 ? '0' + i : String(i);
        opt.value = val;
        opt.innerText = String(i);
        selTgl.appendChild(opt);
      }

      selTgl.value = clampedDay < 10 ? '0' + clampedDay : String(clampedDay);
    }

    window.onload = function() {
      const selTgl = document.getElementById('selectTgl');
      const selBln = document.getElementById('selectBulan');
      const selThn = document.getElementById('selectTahun');
      const inputTgl = document.getElementById('inputTanggal');

      namaBulan.forEach((bln, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx);
        opt.innerText = bln;
        selBln.appendChild(opt);
      });

      const thnSkrg = new Date().getFullYear();
      for (let i = thnSkrg; i <= thnSkrg + 10; i++) {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.innerText = String(i);
        selThn.appendChild(opt);
      }

      populateDaysForMonthYear(thnSkrg, 0, 1);
      setDurationPreset(1);

      inputTgl.addEventListener('change', function() {
        if (!this.value) return;
        const parts = this.value.split('-');
        if (parts.length !== 3) return;
        const y = parseInt(parts[0], 10);
        const mIdx = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);

        selThn.value = String(y);
        selBln.value = String(mIdx);
        populateDaysForMonthYear(y, mIdx, d);
      });

      selBln.addEventListener('change', function() {
        const y = parseInt(selThn.value, 10);
        const mIdx = parseInt(this.value, 10);
        populateDaysForMonthYear(y, mIdx, selTgl.value);
        syncSelectToInputDate();
      });

      selThn.addEventListener('change', function() {
        const y = parseInt(this.value, 10);
        const mIdx = parseInt(selBln.value, 10);
        populateDaysForMonthYear(y, mIdx, selTgl.value);
        syncSelectToInputDate();
      });

      selTgl.addEventListener('change', syncSelectToInputDate);
    };

    function syncSelectToInputDate() {
      const tgl = document.getElementById('selectTgl').value;
      const bln = parseInt(document.getElementById('selectBulan').value, 10) + 1;
      const thn = document.getElementById('selectTahun').value;

      const blnStr = bln < 10 ? '0' + bln : String(bln);
      document.getElementById('inputTanggal').value = `${thn}-${blnStr}-${tgl}`;
    }

    function setDurationPreset(months) {
      const now = new Date();
      const targetYear = now.getFullYear();
      const targetMonthIdx = now.getMonth() + months;
      const maxDayInTargetMonth = new Date(targetYear, targetMonthIdx + 1, 0).getDate();
      const safeDay = Math.min(now.getDate(), maxDayInTargetMonth);
      const d = new Date(targetYear, targetMonthIdx, safeDay);

      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');

      document.getElementById('selectTahun').value = String(yyyy);
      document.getElementById('selectBulan').value = String(d.getMonth());
      populateDaysForMonthYear(yyyy, d.getMonth(), dd);
      document.getElementById('inputTanggal').value = `${yyyy}-${mm}-${dd}`;
    }

    function randomSafeString(len) {
      let str = '';
      for (let i = 0; i < len; i++) {
        str += SAFE_RANDOM_CHARS.charAt(Math.floor(Math.random() * SAFE_RANDOM_CHARS.length));
      }
      return str.replace(/NX/g, 'N_');
    }

    function generateSecureToken() {
      const tglVal = document.getElementById('inputTanggal').value;
      if (!tglVal) {
        alert('Pilih tanggal dulu bro!');
        return;
      }

      const parts = tglVal.split('-');
      if (parts.length !== 3) {
        alert('Format tanggal tidak valid!');
        return;
      }

      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10);
      const day = parseInt(parts[2], 10);
      const targetDate = new Date(year, month - 1, day, 23, 59, 59, 999);

      if (Number.isNaN(targetDate.getTime())) {
        alert('Tanggal tidak valid!');
        return;
      }

      const timeHex = targetDate.getTime().toString(16);
      const randomPrefix = randomSafeString(18);
      const randomSuffix = randomSafeString(18);

      const finalToken = `${randomPrefix}NX${timeHex}${randomSuffix}`;
      document.getElementById('outputToken').innerText = finalToken;
    }

    function copyTokenText() {
      const tokenText = document.getElementById('outputToken').innerText.trim();
      const copyBtnSvg = document.getElementById('copyIconSvg');
      
      if (!tokenText || tokenText.includes('Token aman akan muncul')) {
        alert('Generate tokennya dulu, Bro!');
        return;
      }
      
      navigator.clipboard.writeText(tokenText).then(() => {
        copyBtnSvg.innerHTML = '<polyline points="20 6 9 17 4 12" stroke="#22c55e" stroke-width="2.5"></polyline>';
        setTimeout(() => {
          copyBtnSvg.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
        }, 1500);
      }).catch(err => {
        console.error("Gagal menyalin text: ", err);
      });
    }
  </script>
</body>
</html>
