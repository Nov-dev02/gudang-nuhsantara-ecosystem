<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuhsantara Secure Token Generator</title>
  
  <!-- FAVICON / LOGO TAB BROWSER -->
  <link rel="icon" type="image/png" href="../app-proses-data/icon-v2-192.png">
  <link rel="apple-touch-icon" href="../app-proses-data/icon-v2-192.png">

  <style>
    body { background: #070b14; color: #f8fafc; font-family: monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #0f172a; border: 1px solid #334155; padding: 30px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    h2 { color: #38bdf8; font-size: 18px; margin-top: 0; text-align: center; }
    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
    
    input, select { 
      width: 100%; padding: 10px; background: #020617; border: 1px solid #475569; 
      color: white; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; 
      font-family: monospace; font-size: 13px; outline: none;
    }
    input:focus, select:focus { border-color: #38bdf8; }

    /* Custom Input Tanggal & Dropdown */
    .date-select-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .date-select-group select { margin-bottom: 0; }

    /* Tombol Pilihan Cepat (Presets) */
    .preset-btns { display: flex; gap: 6px; margin-bottom: 16px; }
    .btn-preset { background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 6px 10px; font-size: 11px; border-radius: 6px; cursor: pointer; flex: 1; font-family: monospace; }
    .btn-preset:hover { background: #0284c7; color: white; border-color: #38bdf8; }

    button.btn-generate { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 13px; }
    button.btn-generate:hover { background: #0369a1; }
    
    .result-wrapper { position: relative; margin-top: 20px; }
    .result { background: #020617; padding: 12px 42px 12px 12px; border: 1px dashed #38bdf8; border-radius: 8px; word-break: break-all; color: #38bdf8; font-size: 11.5px; text-align: left; min-height: 42px; box-sizing: border-box; display: flex; align-items: center; }
    
    .btn-copy { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: #1e293b; border: 1px solid #475569; color: #38bdf8; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .btn-copy:hover { background: #334155; border-color: #38bdf8; }

    /* Penyesuaian Ikon Kalender Native Browser */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔐 Secure Token Generator</h2>

    <!-- PILIHAN DURASI CEPAT -->
    <label>Pilih Durasi Cepat:</label>
    <div class="preset-btns">
      <button class="btn-preset" onclick="setDurationPreset(1)">+1 Bulan</button>
      <button class="btn-preset" onclick="setDurationPreset(3)">+3 Bulan</button>
      <button class="btn-preset" onclick="setDurationPreset(6)">+6 Bulan</button>
      <button class="btn-preset" onclick="setDurationPreset(12)">+1 Tahun</button>
    </div>

    <!-- PENGATURAN TANGGAL KUSTOM -->
    <label>Atau Pilih Tanggal manual (dd/mm/yyyy):</label>
    <input type="date" id="inputTanggal">

    <!-- DROPDOWN ALTERNATIF BULAN & TAHUN -->
    <div class="date-select-group">
      <select id="selectTgl" style="flex: 1;"></select>
      <select id="selectBulan" style="flex: 2;"></select>
      <select id="selectTahun" style="flex: 1.5;"></select>
    </div>
    
    <button class="btn-generate" onclick="generateSecureToken()">GENERATE SECURE TOKEN</button>

    <div class="result-wrapper">
      <div class="result" id="outputToken">Token aman akan muncul di sini...</div>
      <button type="button" class="btn-copy" id="btnCopyToken" title="Salin Token" onclick="copyTokenText()">
        <svg id="copyIconSvg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

    // Inisialisasi Dropdown Tanggal, Bulan, Tahun
    window.onload = function() {
      const selTgl = document.getElementById('selectTgl');
      const selBln = document.getElementById('selectBulan');
      const selThn = document.getElementById('selectTahun');

      // Populate Tanggal 1-31
      for(let i = 1; i <= 31; i++) {
        let opt = document.createElement('option');
        opt.value = i < 10 ? '0' + i : i;
        opt.innerText = i;
        selTgl.appendChild(opt);
      }

      // Populate Bulan
      namaBulan.forEach((bln, idx) => {
        let opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = bln;
        selBln.appendChild(opt);
      });

      // Populate Tahun (Tahun Sekarang sampai 10 tahun ke depan)
      const thnSkrg = new Date().getFullYear();
      for(let i = thnSkrg; i <= thnSkrg + 10; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = i;
        selThn.appendChild(opt);
      }

      // Set Default ke Hari Ini + 1 Bulan
      setDurationPreset(1);

      // Listener Sync antara Input Native & Dropdown
      document.getElementById('inputTanggal').addEventListener('change', function() {
        if (this.value) {
          let d = new Date(this.value);
          selTgl.value = (d.getDate() < 10 ? '0' : '') + d.getDate();
          selBln.value = d.getMonth();
          selThn.value = d.getFullYear();
        }
      });

      [selTgl, selBln, selThn].forEach(elem => {
        elem.addEventListener('change', syncSelectToInputDate);
      });
    };

    function syncSelectToInputDate() {
      const tgl = document.getElementById('selectTgl').value;
      const bln = parseInt(document.getElementById('selectBulan').value) + 1;
      const thn = document.getElementById('selectTahun').value;
      
      const blnStr = bln < 10 ? '0' + bln : bln;
      document.getElementById('inputTanggal').value = `${thn}-${blnStr}-${tgl}`;
    }

    function setDurationPreset(months) {
      let d = new Date();
      d.setMonth(d.getMonth() + months);
      
      let yyyy = d.getFullYear();
      let mm = String(d.getMonth() + 1).padStart(2, '0');
      let dd = String(d.getDate()).padStart(2, '0');

      document.getElementById('inputTanggal').value = `${yyyy}-${mm}-${dd}`;
      document.getElementById('selectTgl').value = dd;
      document.getElementById('selectBulan').value = d.getMonth();
      document.getElementById('selectTahun').value = yyyy;
    }

    function generateSecureToken() {
      const tglVal = document.getElementById('inputTanggal').value;
      if (!tglVal) {
        alert('Pilih tanggal dulu bro!');
        return;
      }

      let targetDate = new Date(tglVal + 'T23:59:59');
      let timeHex = targetDate.getTime().toString(16);
      
      let chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let randomPrefix = '';
      for (let i = 0; i < 18; i++) randomPrefix += chars.charAt(Math.floor(Math.random() * chars.length));
      
      let randomSuffix = '';
      for (let i = 0; i < 18; i++) randomSuffix += chars.charAt(Math.floor(Math.random() * chars.length));

      let finalToken = randomPrefix + "NX" + timeHex + randomSuffix;
      
      document.getElementById('outputToken').innerText = finalToken;
    }

    function copyTokenText() {
      const tokenText = document.getElementById('outputToken').innerText;
      const copyBtnSvg = document.getElementById('copyIconSvg');
      
      if (!tokenText || tokenText.includes('Token aman akan muncul')) {
        alert('Generate tokennya dulu, Bro!');
        return;
      }
      
      navigator.clipboard.writeText(tokenText).then(() => {
        copyBtnSvg.innerHTML = '<polyline points="20 6 9 17 4 12" stroke="#22c55e" stroke-width="2.5"></polyline>';
        setTimeout(() => {
          copyBtnSvg.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
        }, 1500);
      }).catch(err => {
        console.error("Gagal menyalin text: ", err);
      });
    }
  </script>
</body>
</html>
